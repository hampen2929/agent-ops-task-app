name: evaluation-book
on:
  push:
    branches: ["codex/evaluation-book-lab"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python3 -m unittest discover -s examples/evaluation-book -p test_record_contract.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: node examples/evaluation-book/lab.mjs . evaluation-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evaluation-results/
