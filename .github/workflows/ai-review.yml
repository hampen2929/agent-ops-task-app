# PRの一次レビュー（観点ベース・severityゲート）
# 『Claude Code本番運用ガイド』「品質評価」の章 /
# 解説記事: https://zenn.dev/hampen2929/articles/20260814-ci-ai-pr-review
name: AI Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # フォークからのPRでは動かさない（信頼境界 — 「セキュリティ」の章）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g @anthropic-ai/claude-code
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr.diff
          claude --bare -p "$(cat .github/prompts/review.md)" \
            --allowedTools "Read,Grep,Glob" \
            --permission-mode dontAsk \
            --output-format json \
            --max-budget-usd 0.50 \
            --json-schema "$(cat .github/schemas/review-schema.json)" \
            > /tmp/review.json
          test "$(jq -r '.is_error' /tmp/review.json)" != "true" || {
            echo "::error::ジョブ内で失敗: $(jq -r '.result' /tmp/review.json)"; exit 1; }

      - name: Judge and post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          jq '.structured_output' /tmp/review.json > /tmp/result.json

          # 承認判定: dismissされていないhigh以上の指摘の数（判定はAIではなくjq）
          blocking=$(jq '[.findings[]
            | select(.dismissed | not)
            | select(.severity == "high" or .severity == "critical")
            ] | length' /tmp/result.json)

          body=$(jq -r '
            "## AIレビュー結果\n\n" + .summary + "\n\n" +
            ([.findings[] |
              "- " + (if .dismissed then "~~" else "" end) +
              "**[\(.severity)] \(.id)** `\(.file):\(.line)` — \(.comment)" +
              (if .dismissed then "~~（例外合意によりdismiss）" else "" end)
            ] | join("\n"))
          ' /tmp/result.json)

          if [ "$blocking" -eq 0 ]; then
            gh pr review "$PR" --approve --body "$body"
          else
            gh pr review "$PR" --request-changes --body "$body"
          fi
